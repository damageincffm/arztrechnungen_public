<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arztrechnungen">
<meta name="theme-color" content="#f2f3f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Arztrechnungen</title>
<style>
:root{color-scheme:light dark;--app:light-dark(#f2f3f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#111318,#f2f2f5);--mute:light-dark(#5b6170,#a1a5b0);--line:light-dark(#e3e5ea,#2c2c30);--acc:light-dark(#1240e0,#7d9bff);--accs:light-dark(#e8edff,#1a2350);--ok:light-dark(#1d6fb8,#6cb4f5);--oks:light-dark(#e3f0fb,#12283d);--warn:light-dark(#9a5b00,#f2b54a);--warns:light-dark(#fff2d9,#3a2a0c);--bad:light-dark(#b8410b,#ff8a50);--bads:light-dark(#ffe7da,#3d1a0a)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--app);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.top{padding:calc(env(safe-area-inset-top) + 14px) 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.top h2,h2{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
.back{background:none;border:0;color:var(--acc);font:inherit;font-size:17px;padding:10px 0;min-height:44px;cursor:pointer}
.seg{display:flex;overflow-x:auto;max-width:62%;background:light-dark(#e4e6ec,#1c1c1e);border-radius:9px;padding:2px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:500;padding:6px 12px;border-radius:7px;color:var(--ink);min-height:34px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
button.card{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-size:19px;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.ok{color:var(--ok);background:var(--oks)}.warn{color:var(--warn);background:var(--warns)}.bad{color:var(--bad);background:var(--bads)}.done{color:var(--mute);background:var(--line)}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{position:relative;height:12px;border-radius:6px;background:var(--line);margin:12px 0 8px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.meter .ok,.meter .warn,.meter .bad{background:currentColor}
.meter .done{background:var(--mute)}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.say{font-size:15px;margin-top:10px}
.list{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.list>.item:first-child{border-top:0}
button.item{cursor:pointer}
.item .t{flex:1}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.chip{border:0;font:inherit;font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px;min-height:30px;cursor:pointer}
h3{font-size:13px;font-weight:600;color:var(--mute);margin:18px 4px 8px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:light-dark(#fff,#000);font:inherit;font-weight:600;font-size:17px;padding:14px;min-height:50px;margin-bottom:10px;text-align:center;cursor:pointer}
.btn.alt{background:var(--accs);color:var(--acc)}
.btn.danger{background:var(--bads);color:var(--bad)}
.btn[disabled]{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
details summary{cursor:pointer;color:var(--acc);font-weight:500;min-height:32px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.f{margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.f .lbl{font-size:13px;color:var(--mute);margin:0 0 6px 4px}
.f label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px 4px}
.f textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.raw{white-space:pre-wrap;font-size:12px;line-height:1.4;color:var(--mute);max-height:300px;overflow:auto;margin:8px 0 0}
details.card summary{margin-bottom:4px}
.f input,.f select{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;-webkit-appearance:none;appearance:none}
.f input.unsure{border-color:var(--warn);background:var(--warns)}
.hint{font-size:13px;color:var(--warn);margin:4px 4px 0}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.tabs{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);background:var(--card);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{border:0;background:none;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;min-height:44px;cursor:pointer}
.tabs button.on{color:var(--acc)}
.tabs .plus{width:52px;height:52px;border-radius:50%;background:var(--acc);color:light-dark(#fff,#000);font-size:30px;line-height:1;justify-content:center;min-width:52px}
.preview{background:var(--card);border-radius:14px;padding:8px;margin-bottom:14px;text-align:center}
.preview img,.preview canvas{max-width:100%;max-height:420px;border-radius:6px;display:block;margin:0 auto 6px}
.tree .dir{font-weight:600;padding:10px 16px;border-top:1px solid var(--line)}
.tree .file{padding:10px 16px 10px 40px;font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:light-dark(#1c1c1e,#f2f2f5);color:light-dark(#fff,#111);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:4}
.sheet{background:var(--app);width:100%;border-radius:18px 18px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:90%;overflow-y:auto}
.sheet h4{margin:0 0 6px;font-size:20px}
.empty{text-align:center;color:var(--mute);padding:32px 16px}
.busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1;color:var(--mute)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="busy"><div class="spin"></div>Wird geladen …</div></div>
<script src="pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
